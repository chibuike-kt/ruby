services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruby
      POSTGRES_PASSWORD: ruby
      POSTGRES_DB: ruby
      # Postgres 18's image expects a version-specific data subdirectory;
      # a fresh named volume on some Docker Desktop hosts (e.g. Windows)
      # can contain a stray lost+found that makes it think data already
      # exists at the mount root. Nesting PGDATA avoids that false positive.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruby -d ruby"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
